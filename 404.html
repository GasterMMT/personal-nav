  <script>
    (function () {
      var root = document.documentElement;
      var hue = 205;
      try {
        var savedHue = parseInt(localStorage.getItem("gastermmt-hue"), 10);
        if (isFinite(savedHue) && savedHue >= 0 && savedHue <= 360) hue = savedHue;
      } catch (error) {}
      var theme = "auto";
      try {
        var savedTheme = localStorage.getItem("gastermmt-theme");
        if (savedTheme === "auto" || savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
      } catch (error) {}
      var effects = "on";
      try {
        if (localStorage.getItem("gastermmt-effects") === "off") effects = "off";
      } catch (error) {}
      root.dataset.theme = theme;
      root.dataset.effects = effects;
      root.style.setProperty("--hue", String(hue));
    })();
  </script>
